<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Knight Game - Play Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #00ffff;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 10px #00ffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #00ffff;
            border-radius: 5px;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 5px;
            padding: 15px 30px;
            color: #00ff00;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }

        #controls {
            position: absolute;
            bottom: 100px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00ff;
            border-radius: 5px;
            padding: 15px;
            color: #ff00ff;
            font-size: 14px;
            text-align: right;
        }

        .control-line {
            margin: 5px 0;
        }

        .key {
            background: #00ffff;
            color: #000;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
            min-width: 30px;
            text-align: center;
        }

        button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff00ff;
        }

        button:active {
            transform: scale(0.95);
        }

        #title {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            color: #00ffff;
            font-size: 28px;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #0088ff;
            letter-spacing: 3px;
            font-weight: bold;
            text-align: right;
        }

        .subtitle {
            font-size: 14px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-top: 5px;
        }

        #levelInfo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00ff;
            border-radius: 5px;
            padding: 10px 20px;
            color: #ff00ff;
            font-weight: bold;
            text-align: center;
        }

        #score {
            position: absolute;
            top: 180px;
            left: 20px;
            z-index: 100;
            color: #ffaa00;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 10px #ffaa00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #ffaa00;
            border-radius: 5px;
        }

        #highscores {
            position: absolute;
            bottom: 100px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffff00;
            border-radius: 5px;
            padding: 15px;
            color: #ffff00;
            font-size: 12px;
            max-width: 250px;
            font-weight: bold;
        }

        .highscore-item {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 0, 0.1);
            border-radius: 3px;
        }

        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: none;
            gap: 10px;
        }

        .mobile-btn {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border: 2px solid #00ffff;
            padding: 15px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        @media (max-width: 768px) {
            #mobileControls {
                display: flex;
                flex-wrap: wrap;
            }
            #controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="title">
            ⚔️ HOLLOW KNIGHT ⚔️
            <div class="subtitle">Web Edition</div>
        </div>

        <div id="levelInfo">
            <span id="levelText">Level 1</span>
        </div>

        <div id="ui">
            <div id="health">Health: 100 / 100</div>
            <div id="enemies">Enemies: 2</div>
        </div>

        <div id="score">
            Score: <span id="scoreValue">0</span>
        </div>

        <div id="highscores">
            Top 5 Scores:
            <div id="scoresList"></div>
        </div>

        <div id="controls">
            <div class="control-line"><span class="key">A</span> Move Left</div>
            <div class="control-line"><span class="key">D</span> Move Right</div>
            <div class="control-line"><span class="key">SPACE</span> Jump</div>
            <div class="control-line"><span class="key">CLICK</span> Attack</div>
        </div>

        <div id="mobileControls">
            <button class="mobile-btn" onmousedown="mobileMove(-1)" onmouseup="mobileMove(0)" ontouchstart="mobileMove(-1)" ontouchend="mobileMove(0)">← LEFT</button>
            <button class="mobile-btn" onmousedown="mobileJump()" ontouchstart="mobileJump()">↑ JUMP</button>
            <button class="mobile-btn" onmousedown="mobileMove(1)" onmouseup="mobileMove(0)" ontouchstart="mobileMove(1)" ontouchend="mobileMove(0)">RIGHT →</button>
            <button class="mobile-btn" onmousedown="mobileAttack()" ontouchstart="mobileAttack()">⚔ ATTACK</button>
        </div>

        <div id="status">Ready to play! Click START GAME</div>

        <button onclick="startGame()">▶ START GAME</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const healthUI = document.getElementById('health');
        const enemiesUI = document.getElementById('enemies');
        const levelText = document.getElementById('levelText');
        const scoreValue = document.getElementById('scoreValue');
        const scoresList = document.getElementById('scoresList');

        // Audio context for sound effects
        let audioContext;
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sound effects
        function playSound(frequency, duration, type = 'sine') {
            initAudio();
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.frequency.value = frequency;
            osc.type = type;
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            osc.start(now);
            osc.stop(now + duration);
        }

        function playSoundAttack() { playSound(400, 0.1); playSound(600, 0.1); }
        function playSoundEnemyHit() { playSound(200, 0.15); }
        function playSoundVictory() { playSound(800, 0.2); playSound(1000, 0.2); }
        function playSoundGameOver() { playSound(100, 0.5); }
        function playSoundJump() { playSound(300, 0.1); }
        function playSoundLevelUp() { playSound(500, 0.1); playSound(700, 0.1); playSound(900, 0.1); }

        // Set canvas to window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game variables
        const gravity = 0.6;
        let gameRunning = false;
        let currentLevel = 1;
        let score = 0;
        let mobileMovement = 0;

        // Highscores (from localStorage)
        let highscores = JSON.parse(localStorage.getItem('hollowKnightScores')) || [];

        function saveHighscore(points) {
            highscores.push(points);
            highscores.sort((a, b) => b - a);
            highscores = highscores.slice(0, 5);
            localStorage.setItem('hollowKnightScores', JSON.stringify(highscores));
            updateHighscoresDisplay();
        }

        function updateHighscoresDisplay() {
            scoresList.innerHTML = highscores.map((score, i) => 
                `<div class="highscore-item">#${i + 1}: ${score} pts</div>`
            ).join('');
        }

        updateHighscoresDisplay();

        // Draw Knight Character
        function drawKnight(x, y, width, height, isFlipped = false) {
            ctx.save();
            ctx.translate(x + width / 2, y);
            if (isFlipped) ctx.scale(-1, 1);
            ctx.translate(-(width / 2), 0);

            // Body (dark armor)
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.ellipse(x + width / 2, y + height * 0.4, width * 0.35, height * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();

            // Chest plate accent
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.ellipse(x + width / 2, y + height * 0.35, width * 0.2, height * 0.25, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head/Helmet
            ctx.fillStyle = '#0a0e27';
            ctx.beginPath();
            ctx.ellipse(x + width / 2, y + height * 0.15, width * 0.3, width * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();

            // Helmet visor (glowing)
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.ellipse(x + width / 2, y + height * 0.12, width * 0.15, width * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Visor eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + width / 2 - width * 0.06, y + height * 0.12, width * 0.04, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width / 2 + width * 0.06, y + height * 0.12, width * 0.04, 0, Math.PI * 2);
            ctx.fill();

            // Left Arm (blade-like)
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.moveTo(x + width / 2 - width * 0.35, y + height * 0.3);
            ctx.lineTo(x + width / 2 - width * 0.65, y + height * 0.5);
            ctx.lineTo(x + width / 2 - width * 0.6, y + height * 0.55);
            ctx.lineTo(x + width / 2 - width * 0.3, y + height * 0.35);
            ctx.fill();

            // Left Arm Blade (cyan accent)
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(x + width / 2 - width * 0.65, y + height * 0.5);
            ctx.lineTo(x + width / 2 - width * 0.75, y + height * 0.65);
            ctx.lineTo(x + width / 2 - width * 0.7, y + height * 0.63);
            ctx.fill();

            // Right Arm
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.moveTo(x + width / 2 + width * 0.35, y + height * 0.3);
            ctx.lineTo(x + width / 2 + width * 0.65, y + height * 0.5);
            ctx.lineTo(x + width / 2 + width * 0.6, y + height * 0.55);
            ctx.lineTo(x + width / 2 + width * 0.3, y + height * 0.35);
            ctx.fill();

            // Left Leg
            ctx.fillStyle = '#0a0e27';
            ctx.beginPath();
            ctx.moveTo(x + width / 2 - width * 0.2, y + height * 0.65);
            ctx.lineTo(x + width / 2 - width * 0.25, y + height);
            ctx.lineTo(x + width / 2 - width * 0.15, y + height);
            ctx.lineTo(x + width / 2 - width * 0.1, y + height * 0.65);
            ctx.fill();

            // Right Leg
            ctx.fillStyle = '#0a0e27';
            ctx.beginPath();
            ctx.moveTo(x + width / 2 + width * 0.2, y + height * 0.65);
            ctx.lineTo(x + width / 2 + width * 0.25, y + height);
            ctx.lineTo(x + width / 2 + width * 0.15, y + height);
            ctx.lineTo(x + width / 2 + width * 0.1, y + height * 0.65);
            ctx.fill();

            // Feet accent (cyan)
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(x + width / 2 - width * 0.2, y + height - 5, width * 0.4, 3);

            ctx.restore();
        }

        // Draw Enemy (creature-like)
        function drawEnemy(x, y, width, height, isBoss = false) {
            // Body
            ctx.fillStyle = isBoss ? '#ff00ff' : '#ff1744';
            ctx.beginPath();
            ctx.ellipse(x + width / 2, y + height * 0.5, width * 0.4, height * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = isBoss ? '#ff66ff' : '#ff6b6b';
            ctx.beginPath();
            ctx.arc(x + width / 2, y + height * 0.15, width * 0.35, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + width / 2 - width * 0.15, y + height * 0.1, width * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width / 2 + width * 0.15, y + height * 0.1, width * 0.12, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + width / 2 - width * 0.15, y + height * 0.1, width * 0.06, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width / 2 + width * 0.15, y + height * 0.1, width * 0.06, 0, Math.PI * 2);
            ctx.fill();

            // Spikes/Tentacles
            ctx.strokeStyle = isBoss ? '#ff00ff' : '#ff1744';
            ctx.lineWidth = isBoss ? 5 : 3;
            const spikeCount = isBoss ? 6 : 4;
            for (let i = 0; i < spikeCount; i++) {
                const angle = (Math.PI * 2 * i) / spikeCount;
                const sx = x + width / 2 + Math.cos(angle) * width * 0.35;
                const sy = y + height * 0.5 + Math.sin(angle) * height * 0.35;
                const ex = x + width / 2 + Math.cos(angle) * width * (isBoss ? 0.7 : 0.55);
                const ey = y + height * 0.5 + Math.sin(angle) * height * (isBoss ? 0.7 : 0.55);
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            }
        }

        // Player object
        const player = {
            x: 100,
            y: canvas.height - 150,
            width: 50,
            height: 60,
            velocityY: 0,
            velocityX: 0,
            isJumping: false,
            health: 100,
            maxHealth: 100,
            speed: 7,
            jumpPower: -15,
            isFlipped: false
        };

        // Enemies array
        let enemies = [];

        // Keys pressed
        const keys = {};

        // Event listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('click', (e) => {
            if (gameRunning) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                attackEnemy(mouseX, mouseY);
            }
        });

        // Mobile controls
        function mobileMove(dir) {
            mobileMovement = dir;
        }

        function mobileJump() {
            if (gameRunning && !player.isJumping) {
                const groundY = canvas.height - 100;
                if (player.y + player.height >= groundY) {
                    player.velocityY = player.jumpPower;
                    player.isJumping = true;
                    playSoundJump();
                }
            }
        }

        function mobileAttack() {
            if (gameRunning) {
                attackEnemy(player.x + player.width / 2, player.y);
            }
        }

        // Enemy class
        class Enemy {
            constructor(x, y, isBoss = false) {
                this.x = x;
                this.y = y;
                this.width = isBoss ? 80 : 50;
                this.height = isBoss ? 80 : 50;
                this.velocityY = 0;
                this.health = isBoss ? 100 : 30;
                this.maxHealth = isBoss ? 100 : 30;
                this.speed = isBoss ? 2 : 3;
                this.direction = 1;
                this.detectionRange = 400;
                this.chasing = false;
                this.isBoss = isBoss;
            }

            update() {
                // Gravity
                this.velocityY += gravity;
                this.y += this.velocityY;

                // Collision with ground
                const groundY = canvas.height - 100;
                if (this.y + this.height >= groundY) {
                    this.y = groundY - this.height;
                    this.velocityY = 0;
                }

                // Distance to player
                const distToPlayer = Math.abs(player.x - this.x);

                if (distToPlayer < this.detectionRange) {
                    this.chasing = true;
                    this.direction = player.x > this.x ? 1 : -1;
                } else {
                    this.chasing = false;
                }

                // Movement
                if (this.chasing) {
                    this.x += this.speed * this.direction;
                } else {
                    this.x += this.speed * this.direction;
                    if (this.x < 50 || this.x > canvas.width - 50) {
                        this.direction *= -1;
                    }
                }

                // Collision with player
                if (this.isCollidingWith(player)) {
                    player.health -= this.isBoss ? 1 : 0.3;
                }
            }

            isCollidingWith(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }

            draw() {
                drawEnemy(this.x, this.y, this.width, this.height, this.isBoss);
                
                // Health bar
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x, this.y - 15, this.width, 8);
                ctx.fillStyle = this.isBoss ? '#ff00ff' : '#ff1744';
                ctx.fillRect(this.x, this.y - 15, (this.health / this.maxHealth) * this.width, 8);
            }
        }

        function initGame() {
            player.x = 100;
            player.y = canvas.height - 150;
            player.velocityY = 0;
            player.velocityX = 0;
            player.health = 100;
            player.isJumping = false;
            player.isFlipped = false;
            score = 0;
            scoreValue.textContent = '0';

            const groundY = canvas.height - 100;
            enemies = [];

            if (currentLevel === 1) {
                enemies = [
                    new Enemy(canvas.width / 3, groundY - 50),
                    new Enemy((canvas.width * 2) / 3, groundY - 50)
                ];
            } else if (currentLevel === 2) {
                enemies = [
                    new Enemy(canvas.width / 4, groundY - 50),
                    new Enemy((canvas.width * 2) / 4, groundY - 50),
                    new Enemy((canvas.width * 3) / 4, groundY - 50)
                ];
            } else if (currentLevel === 3) {
                enemies = [
                    new Enemy(canvas.width / 2, groundY - 100, true) // Boss
                ];
            }

            levelText.textContent = `Level ${currentLevel}`;
        }

        function updatePlayer() {
            // Horizontal movement
            let moveDir = 0;
            if (keys['a'] || mobileMovement === -1) {
                moveDir = -1;
                player.isFlipped = true;
            } else if (keys['d'] || mobileMovement === 1) {
                moveDir = 1;
                player.isFlipped = false;
            }

            player.velocityX = moveDir * player.speed;
            player.x += player.velocityX;

            // Boundary
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Gravity
            player.velocityY += gravity;
            player.y += player.velocityY;

            // Ground collision
            const groundY = canvas.height - 100;
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.isJumping = false;
            }

            // Jump
            if ((keys[' '] || keys['w']) && !player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
                playSoundJump();
            }
        }

        function attackEnemy(mouseX, mouseY) {
            enemies.forEach(enemy => {
                const distance = Math.sqrt(
                    Math.pow(mouseX - (enemy.x + enemy.width / 2), 2) +
                    Math.pow(mouseY - (enemy.y + enemy.height / 2), 2)
                );
                if (distance < 150) {
                    enemy.health -= 20;
                    playSoundAttack();
                    playSoundEnemyHit();
                    score += 10;
                    scoreValue.textContent = score;
                }
            });
        }

        function drawPlayer() {
            drawKnight(player.x, player.y, player.width, player.height, player.isFlipped);

            // Health bar
            ctx.fillStyle = '#333';
            ctx.fillRect(player.x, player.y - 25, player.width, 10);
            ctx.fillStyle = player.health > 50 ? '#00ff00' : '#ffaa00';
            ctx.fillRect(player.x, player.y - 25, (player.health / player.maxHealth) * player.width, 10);
        }

        function drawGround() {
            const groundY = canvas.height - 100;
            ctx.fillStyle = '#2a4d2a';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, groundY, canvas.width, canvas.height - groundY);
        }

        function drawUI() {
            // Update UI text
            healthUI.textContent = `Health: ${Math.max(0, Math.floor(player.health))} / ${player.maxHealth}`;
            enemiesUI.textContent = `Enemies: ${enemies.filter(e => e.health > 0).length}`;

            if (player.health <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = 'bold 30px Arial';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 60);
                gameRunning = false;
                playSoundGameOver();
                saveHighscore(score);
                status.textContent = '💀 Game Over! Click START GAME to try again';
                status.style.color = '#ff0000';
            }

            if (enemies.every(e => e.health <= 0) && enemies.length > 0) {
                if (currentLevel === 3) {
                    // Final victory
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#00ff00';
                    ctx.font = 'bold 80px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2);
                    ctx.font = 'bold 30px Arial';
                    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 60);
                    gameRunning = false;
                    playSoundVictory();
                    saveHighscore(score);
                    status.textContent = '🎉 Victory! You defeated the boss!';
                    status.style.color = '#00ff00';
                } else {
                    // Next level
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffff00';
                    ctx.font = 'bold 60px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('LEVEL COMPLETE!', canvas.width / 2, canvas.height / 2);
                    ctx.font = 'bold 30px Arial';
                    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 60);
                    gameRunning = false;
                    playSoundLevelUp();
                    
                    setTimeout(() => {
                        currentLevel++;
                        startGame();
                    }, 3000);
                }
            }
        }

        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                updatePlayer();
                enemies.forEach(enemy => {
                    if (enemy.health > 0) {
                        enemy.update();
                    }
                });

                // Remove dead enemies
                enemies = enemies.filter(e => e.health > 0);
            }

            // Draw
            drawGround();
            drawPlayer();
            enemies.forEach(enemy => enemy.draw());
            drawUI();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameRunning = true;
            initGame();
            status.textContent = '🎮 Game Running! Defeat all enemies!';
            status.style.color = '#00ff00';
        }

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
